<meta charset="utf-8">
<!-- ============================================================= -->
<!--  QUIZ FUNNEL · Tai Chi en silla (Taichi Warrior)      -->
<!--  Motor de quiz de venta: pasos interactivos + resultado        -->
<!--  personalizado animado + página de oferta. 1 solo HTML.        -->
<!--  ----------------------------------------------------------- -->
<!--  EDITÁS SOLO EL BLOQUE "CONFIG" del <script> (abajo).          -->
<!--  Tema: cambiá colores en :root y fuentes en el @import.        -->
<!--  Imágenes "" = placeholder. CSS scopeado a #sp (no rompe nada).-->
<!--  Para Shopify: pegar en una sección "Liquid personalizado".    -->
<!-- ============================================================= -->

<div id="sp">
  <div class="sp-bar"><div class="sp-bar-fill" id="spBar"></div></div>
  <header class="sp-top">
    <button class="sp-back" id="spBack" aria-label="Atrás">‹</button>
    <span class="sp-logo" id="spLogo">Taichi Warrior</span>
    <span class="sp-count" id="spCount"></span>
  </header>
  <main class="sp-stage" id="spStage"></main>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
#sp,#sp *{box-sizing:border-box;margin:0;padding:0}
#sp{
  --bg:#F7F5F1; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F3F0EA; --line:#E4DFD5;
  --ink:#20323A; --soft:#6E8188;
  --bronze:#1B9E82; --bronze2:#24B79A; --crimson:#C4622A; --crimson2:#DE7A38;
  --shadow:0 12px 30px rgba(40,70,80,.12);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(620px 380px at 80% -6%, rgba(27,158,130,.08), transparent 60%),
    radial-gradient(520px 360px at 0% 100%, rgba(222,122,56,.07), transparent 55%),
    linear-gradient(180deg,#FBFAF7,#F4F1EC);
  max-width:520px; margin:0 auto; min-height:84vh; position:relative;
  border-radius:18px; overflow:hidden; -webkit-font-smoothing:antialiased;
}
#sp h1,#sp h2{font-family:'Poppins',sans-serif;font-weight:700;line-height:1.16;text-transform:none;letter-spacing:0}
#sp .cz{font-family:'Poppins',sans-serif}

/* progress + header */
#sp .sp-bar{height:5px;background:#ECE7DE}
#sp .sp-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--crimson),var(--bronze) 70%,var(--bronze2));transition:width .45s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(27,158,130,.5)}
#sp .sp-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
#sp .sp-back{background:none;border:none;color:var(--soft);font-size:26px;line-height:1;cursor:pointer;width:30px;text-align:left;opacity:0;pointer-events:none;transition:opacity .2s}
#sp .sp-back.show{opacity:1;pointer-events:auto}
#sp .sp-logo{font-family:'Poppins',serif;font-weight:800;font-size:16px;letter-spacing:.12em;color:var(--ink)}
#sp .sp-logo::first-letter{color:var(--bronze2)}
#sp .sp-count{font-size:11px;font-weight:700;color:var(--bronze);min-width:50px;text-align:right;letter-spacing:.04em}

#sp .sp-stage{padding:24px 18px 42px;animation:spIn .4s cubic-bezier(.2,.7,.2,1)}
@keyframes spIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
#sp::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);z-index:0}
#sp .sp-phase{animation:spPhase .6s ease}
@keyframes spPhase{from{opacity:0;letter-spacing:.4em}to{opacity:1;letter-spacing:.22em}}

/* phase chip + headings */
#sp .sp-phase{display:block;text-align:center;font-family:'Poppins';text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--bronze);margin-bottom:10px}
#sp .sp-h{font-size:27px;text-align:center;margin-bottom:6px;line-height:1.14}
#sp .sp-h .am{color:var(--bronze2)}
#sp .sp-sub{text-align:center;color:var(--soft);font-size:14.5px;margin-bottom:22px}

/* option cards */
#sp .sp-grid{display:grid;gap:12px}
#sp .sp-grid.cols2{grid-template-columns:1fr 1fr}
#sp .sp-card{background:linear-gradient(165deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left;position:relative}
#sp .sp-card:hover{transform:translateY(-3px);border-color:var(--bronze)}
#sp .sp-card:active{transform:scale(.98)}
#sp .sp-card.sel{border-color:var(--bronze2);box-shadow:0 0 0 2px var(--bronze2),0 0 22px rgba(27,158,130,.35);transform:translateY(-2px)}
#sp .sp-thumb{width:100%;aspect-ratio:1/1;background:linear-gradient(150deg,#EEEAE1,#F6F3EC);display:flex;align-items:center;justify-content:center;color:#A7A093;font-size:12px;text-align:center;padding:8px;font-weight:600}
#sp .sp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
#sp .sp-card.row{display:flex;align-items:center;gap:0;padding:0}
#sp .sp-label{padding:13px 15px;font-weight:700;font-size:15.5px}
#sp .sp-cap{display:block;font-weight:500;font-size:12.5px;color:var(--soft);margin-top:2px}
#sp .sp-card.row .sp-label{padding:17px 16px}
#sp .sp-arrow{margin-left:auto;margin-right:16px;color:var(--bronze);font-size:24px;font-weight:700;line-height:1}
#sp .sp-check{margin-left:auto;margin-right:15px;width:25px;height:25px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#120F0A;transition:.15s}
#sp .sp-card.sel .sp-check{background:var(--bronze2);border-color:var(--bronze2);transform:scale(1.08)}
/* imagen dentro del botón (thumbnail derecho) */
#sp .sp-rthumb{width:88px;height:104px;flex:none;margin:8px 12px 8px 8px;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#EEEAE1,#F6F3EC);border:1px solid var(--line)}
#sp .sp-rthumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
#sp .sp-card.row.hasimg{padding-right:0}
#sp .sp-card.row.hasimg .sp-label{flex:1 1 auto}
#sp .sp-card.row.hasimg .sp-check{margin-left:0}
/* imagen de portada del paso (entry + interstitials + preguntas con foto) */
#sp .sp-hero-step{width:100%;border-radius:16px;overflow:hidden;margin:2px 0 20px;border:1px solid var(--line);background:linear-gradient(150deg,#EEEAE1,#F6F3EC)}
#sp .sp-hero-step img{width:100%;display:block;object-fit:cover}
/* grilla de botones (edad) tipo original: 2x2 sólido teal */
#sp .sp-grid.tiles{grid-template-columns:1fr 1fr}
#sp .sp-card.tile{background:linear-gradient(140deg,var(--bronze2),var(--bronze));border:none;border-radius:14px;min-height:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(27,158,130,.22)}
#sp .sp-card.tile .sp-label{padding:18px 12px;color:#fff;font-size:19px;text-align:center;width:100%}
#sp .sp-card.tile:hover{filter:brightness(1.05);transform:translateY(-2px)}
/* radio a la izquierda (multi, como el original) */
#sp .sp-radio2{width:24px;height:24px;flex:none;margin:0 2px 0 15px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:.15s;position:relative}
#sp .sp-radio2::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;opacity:0;transition:.15s}
#sp .sp-card.sel .sp-radio2{border-color:var(--bronze2);background:var(--bronze2)}
#sp .sp-card.sel .sp-radio2::after{opacity:1}
#sp .sp-card.row.rl .sp-label{flex:1 1 auto;padding-left:12px}

/* buttons */
#sp .sp-cta{display:block;width:100%;margin-top:22px;padding:17px;border:none;border-radius:13px;font-family:'Poppins',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:17px;color:#ffffff;cursor:pointer;background:linear-gradient(140deg,var(--bronze2),var(--bronze));box-shadow:0 10px 26px rgba(27,158,130,.32);transition:transform .15s,filter .2s;text-align:center;text-decoration:none;position:relative;overflow:hidden}
#sp .sp-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:spShine 3.2s infinite}
@keyframes spShine{0%{left:-60%}55%,100%{left:130%}}
#sp .sp-cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
#sp .sp-cta:disabled{opacity:.35;cursor:not-allowed;transform:none}
#sp .sp-cta:disabled::after{display:none}

/* inputs */
#sp .sp-input{width:100%;padding:17px;font-size:18px;text-align:center;font-family:inherit;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;outline:none}
#sp .sp-input:focus{border-color:var(--bronze2);box-shadow:0 0 0 3px rgba(27,158,130,.18)}
#sp .sp-input::placeholder{color:#9AA6A0}

/* interstitial / empathy */
#sp .sp-inter{text-align:center;padding:14px 0}
#sp .sp-icon{width:80px;height:80px;border-radius:50%;margin:6px auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 35% 30%,#E6F0F1,#F5F2EC);border:1.5px solid var(--bronze);box-shadow:0 0 26px rgba(27,158,130,.25)}
#sp .sp-inter h1{font-size:25px;margin-bottom:12px}
#sp .sp-inter h1 .am{color:var(--bronze2)}
#sp .sp-inter p{color:var(--soft);font-size:15px;line-height:1.6;max-width:410px;margin:0 auto}
#sp .sp-quote{font-family:'Poppins';font-style:italic;color:var(--bronze2);font-size:15px;margin:14px auto 0;max-width:360px;opacity:.9}
#sp .sp-empathy{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--crimson2);border-radius:12px;padding:16px 18px;margin-top:18px;text-align:left;animation:spIn .35s}
#sp .sp-empathy b{color:var(--crimson2);display:block;margin-bottom:5px;font-family:'Poppins';text-transform:uppercase;font-size:14px;letter-spacing:.03em}
#sp .sp-empathy p{color:var(--soft);font-size:13.5px;line-height:1.55;margin:0}

/* result + loader */
#sp .sp-result{text-align:center}
#sp .sp-vs{display:flex;gap:12px;margin:20px 0}
#sp .sp-vs > div{flex:1;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:18px 10px}
#sp .sp-vs .tag{font-family:'Poppins';text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--soft)}
#sp .sp-vs .big{font-family:'Poppins';font-weight:800;font-size:30px;margin:8px 0 2px}
#sp .sp-vs.now .big{color:var(--crimson2)} #sp .sp-vs.goal .big{color:var(--bronze2)}
#sp .sp-score{font-family:'Poppins';font-weight:800;font-size:58px;color:var(--bronze2);line-height:1;margin:8px 0;text-shadow:0 0 26px rgba(27,158,130,.3)}
#sp .sp-vsbox{display:flex;gap:12px;margin:18px 0}
#sp .sp-vsbox > div{flex:1;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center}
#sp .sp-vsbox .lab{font-family:'Poppins';text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--soft)}
#sp .sp-vsbox .v{font-family:'Poppins';font-weight:800;font-size:21px;margin-top:5px}
#sp .sp-vsbox.wrap{gap:12px}
#sp .sp-vsbox .nowb .v{color:var(--crimson2)} #sp .sp-vsbox .goalb .v{color:var(--bronze2)}
#sp .sp-metric{margin:14px 0;text-align:left}
#sp .sp-metric .ml{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--soft);font-weight:600}
#sp .sp-track2{height:14px;background:#ECE7DE;border-radius:8px;overflow:hidden}
#sp .sp-fill2{height:100%;width:0;border-radius:8px;transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
#sp .sp-fill2.now{background:linear-gradient(90deg,#C4622A,var(--crimson2))}
#sp .sp-fill2.goal{background:linear-gradient(90deg,var(--bronze),var(--bronze2));box-shadow:0 0 14px rgba(27,158,130,.4)}
#sp .sp-attack{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:12px;padding:15px 16px;margin:18px 0;text-align:left}
#sp .sp-attack b{font-family:'Poppins';text-transform:uppercase;color:var(--bronze2);font-size:13px;display:block;margin-bottom:9px;letter-spacing:.03em}
#sp .sp-attack .z{display:flex;align-items:center;gap:9px;font-size:14.5px;margin:6px 0;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
#sp .sp-attack .z.in{opacity:1;transform:none}
#sp .sp-attack .z .ck{color:var(--bronze2);font-weight:800}
#sp .sp-loader{text-align:center;padding:34px 0}
#sp .sp-forge{font-size:42px;animation:spPulse 1s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(27,158,130,0))}50%{transform:scale(1.12);filter:drop-shadow(0 0 14px rgba(27,158,130,.6))}}
#sp .sp-ring{font-family:'Poppins';font-weight:800;font-size:44px;color:var(--bronze2);margin-top:10px}
#sp .sp-ltrack{height:9px;background:#ECE7DE;border-radius:6px;overflow:hidden;margin:18px 0}
#sp .sp-lfill{height:100%;width:0;background:linear-gradient(90deg,var(--crimson),var(--bronze2));transition:width .25s}

/* SALES */
#sp .sp-timer{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--crimson),var(--crimson2));color:#fff;text-align:center;padding:11px;font-family:'Poppins';font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
#sp .sp-timer span{font-family:'Poppins';font-weight:800;margin-left:6px}
#sp .sp-salebody{padding:26px 18px 42px}
#sp .sp-hero-img{width:100%;min-height:120px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#EEEAE1,#F6F3EC);display:flex;align-items:center;justify-content:center;color:#A7A093;font-size:13px;margin:14px 0;border:1px solid var(--line)}
#sp .sp-hero-img img{width:100%;height:auto;display:block}
#sp .sp-won{background:linear-gradient(140deg,#EAF4F5,#F3F0EA);border:1px solid var(--bronze);border-radius:12px;padding:14px;text-align:center;margin-bottom:8px;box-shadow:0 0 22px rgba(27,158,130,.15)}
#sp .sp-won b{font-family:'Poppins';font-weight:800;color:var(--bronze2)}
#sp .sp-sec{margin:26px 0}
#sp .sp-sec-h{font-family:'Poppins';font-weight:800;text-transform:uppercase;font-size:20px;text-align:center;margin-bottom:16px;letter-spacing:.02em}
#sp .sp-sec-h .am{color:var(--bronze2)}
#sp .sp-incl{list-style:none;display:grid;gap:10px}
#sp .sp-incl li{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14px}
#sp .sp-incl li .ck{color:var(--bronze2);font-weight:800;flex:none}
#sp .sp-how{display:grid;gap:13px}
#sp .sp-how .st{display:flex;gap:13px;align-items:flex-start}
#sp .sp-how .num{width:40px;height:40px;flex:none;border-radius:50%;background:linear-gradient(140deg,var(--bronze2),var(--bronze));color:#ffffff;font-family:'Poppins';font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
#sp .sp-how .st b{font-family:'Poppins';text-transform:uppercase;font-size:15.5px;display:block;margin-bottom:2px}
#sp .sp-how .st p{color:var(--soft);font-size:13.5px;margin:0;line-height:1.45}
#sp .sp-tst{display:grid;gap:12px}
#sp .sp-tst .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#sp .sp-tst .stars{color:var(--bronze2);font-size:13px;letter-spacing:2px}
#sp .sp-tst .q{font-size:13.5px;line-height:1.55;margin:6px 0 8px}
#sp .sp-tst .who{display:flex;justify-content:space-between;font-size:12.5px}
#sp .sp-tst .who b{font-family:'Poppins';text-transform:uppercase}
#sp .sp-tst .who .res{color:var(--bronze2);font-weight:700}
#sp .sp-tier{display:block;width:100%;text-align:left;background:linear-gradient(165deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
#sp .sp-tier.sel{border-color:var(--bronze2);box-shadow:0 0 0 2px var(--bronze2),0 0 18px rgba(27,158,130,.22)}
#sp .sp-tier.pop{border-color:var(--bronze)}
#sp .sp-pop{position:absolute;top:-11px;left:16px;background:linear-gradient(140deg,var(--crimson2),var(--crimson));color:#fff;font-family:'Poppins';font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:3px 11px;border-radius:20px}
#sp .sp-tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#sp .sp-tier-name{font-family:'Poppins';font-weight:700;text-transform:uppercase;font-size:16px}
#sp .sp-tier-old{color:var(--soft);text-decoration:line-through;font-size:13px;margin-right:6px}
#sp .sp-tier-now{font-weight:700;font-size:15px}
#sp .sp-off{display:inline-block;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:5px}
#sp .sp-perday{text-align:right;flex:none}
#sp .sp-perday .pd{font-family:'Poppins';font-weight:800;font-size:25px;line-height:1;color:var(--bronze2)}
#sp .sp-perday .u{font-size:11px;color:var(--soft)}
#sp .sp-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-right:12px;display:inline-block;vertical-align:middle}
#sp .sp-tier.sel .sp-radio{border-color:var(--bronze2);background:radial-gradient(circle,var(--bronze2) 40%,transparent 46%)}
#sp .sp-bonus{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--bronze2);font-weight:600}
#sp .sp-guar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0;font-size:13px;color:var(--soft)}
#sp .sp-guar .g-ic{font-size:26px}
#sp .sp-proof{text-align:center;color:var(--soft);font-size:13px;margin-top:14px}
#sp .sp-proof b{color:var(--ink)}
#sp .sp-faq .it{border-bottom:1px solid var(--line)}
#sp .sp-faq .q{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-family:'Poppins';text-transform:uppercase;font-size:14.5px;font-weight:600;padding:15px 28px 15px 0;cursor:pointer;position:relative}
#sp .sp-faq .q::after{content:'+';position:absolute;right:4px;top:13px;font-size:20px;color:var(--bronze2)}
#sp .sp-faq .it.open .q::after{content:'–'}
#sp .sp-faq .a{max-height:0;overflow:hidden;transition:max-height .25s ease;color:var(--soft);font-size:13.5px;line-height:1.55}
#sp .sp-faq .it.open .a{max-height:260px;padding-bottom:14px}
#sp .sp-disc{font-size:10.5px;color:#9AA6A0;text-align:center;margin-top:18px;line-height:1.5}
#sp .sp-auth{text-align:center;margin:24px 0}
#sp .sp-laurel{font-family:'Poppins';font-weight:800;font-size:36px;color:var(--bronze2);display:flex;align-items:center;justify-content:center;gap:10px}
#sp .sp-laurel .lf{opacity:.85;font-size:30px}
#sp .sp-auth-sub{color:var(--soft);font-size:13px;margin-top:2px}
#sp .sp-stars{font-size:18px;color:var(--bronze2);margin-top:14px;letter-spacing:2px}
#sp .sp-stars b{color:var(--ink);font-family:'Poppins'}
#sp .sp-pay{text-align:center;margin:14px 0 4px}
#sp .sp-pay > span{font-size:12px;color:var(--soft);display:block;margin-bottom:8px}
#sp .sp-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#sp .sp-cards span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-family:'Poppins';font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--ink)}
@media(max-width:430px){#sp .sp-grid.cols2{grid-template-columns:1fr}}
</style>

<!-- ===== Componentes (slider / proyección / medidor) ===== -->
<style>
#sp .sp-sl-wrap{display:flex;flex-direction:column;align-items:center;width:100%;padding:12px 0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
#sp .sp-sl-valbox{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:18px}
#sp .sp-sl-input{font-family:'Poppins',serif;font-size:2.6rem;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1;width:130px;text-align:center;border:none;border-bottom:2px solid var(--line);background:transparent;outline:none;padding:2px 4px}
#sp .sp-sl-input:focus{border-bottom-color:var(--bronze2)}
#sp .sp-sl-unit{font-family:'Poppins',serif;font-size:1.35rem;font-weight:600;color:var(--soft)}
#sp .sp-sl-track-wrap{position:relative;width:100%;height:44px;display:flex;align-items:center;cursor:pointer}
#sp .sp-sl-track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:var(--line);overflow:visible}
#sp .sp-sl-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--bronze),var(--bronze2));pointer-events:none}
#sp .sp-sl-ticks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none}
#sp .sp-sl-tick{position:absolute;width:2px;height:10px;background:var(--line);border-radius:1px;transform:translate(-50%,-50%)}
#sp .sp-sl-tick.sp-sl-tick-filled{background:var(--bronze2);opacity:.5}
#sp .sp-sl-thumb{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--bronze),var(--bronze2));box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--bronze),0 4px 16px rgba(27,158,130,.45);transform:translate(-50%,-50%);transition:box-shadow .15s;cursor:grab;z-index:2}
#sp .sp-sl-thumb:active{cursor:grabbing;box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--bronze2),0 6px 24px rgba(27,158,130,.6)}
#sp .sp-pj-wrap{font-family:inherit;width:100%;box-sizing:border-box;padding:0 0 8px}
#sp .sp-pj-headline{color:var(--ink);font-size:1.1rem;font-weight:700;text-align:center;margin:0 0 12px;letter-spacing:.01em}
#sp .sp-pj-svg{width:100%;display:block;overflow:visible}
#sp .sp-pj-axis-label{fill:var(--soft);font-size:11px;font-family:inherit}
#sp .sp-pj-weight-label{font-size:13px;font-weight:700;font-family:inherit}
#sp .sp-pj-dot{animation:sp-pj-pulse 1.8s ease-in-out infinite}
@keyframes sp-pj-pulse{0%,100%{opacity:1;r:5}50%{opacity:.5;r:8}}
#sp .sp-gg-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
#sp .sp-gg-label{font-family:'Poppins',serif;font-size:.85rem;color:var(--soft);letter-spacing:.08em;text-transform:uppercase;text-align:center}
#sp .sp-gg-svg{width:100%;max-width:280px;display:block;margin:0 auto;overflow:visible}
#sp .sp-gg-value{font-family:'Poppins',serif;font-size:2.4rem;font-weight:700;color:var(--ink);line-height:1;text-align:center;margin-top:-18px}
#sp .sp-gg-sublabel{font-size:.75rem;color:var(--soft);letter-spacing:.06em;text-align:center;margin-top:2px}

<script>
function spSlider(opts){
  var o=Object.assign({min:0,max:100,value:50,step:1,unit:'',accent:null},opts);
  var cur=Math.min(o.max,Math.max(o.min,o.value));
  var wrap=document.createElement('div');wrap.className='sp-sl-wrap';wrap.setAttribute('tabindex','0');
  var valbox=document.createElement('div');valbox.className='sp-sl-valbox';
  var inputEl=document.createElement('input');inputEl.className='sp-sl-input';inputEl.type='text';inputEl.setAttribute('inputmode','numeric');inputEl.setAttribute('aria-label','Valor');
  var unitEl=document.createElement('span');unitEl.className='sp-sl-unit';unitEl.textContent=o.unit||'';
  valbox.appendChild(inputEl);valbox.appendChild(unitEl);
  var tw=document.createElement('div');tw.className='sp-sl-track-wrap';
  var track=document.createElement('div');track.className='sp-sl-track';
  var fill=document.createElement('div');fill.className='sp-sl-fill';
  var ticks=document.createElement('div');ticks.className='sp-sl-ticks';
  var thumb=document.createElement('div');thumb.className='sp-sl-thumb';
  var steps=Math.round((o.max-o.min)/o.step);
  var maxTicks=20;var tickEvery=Math.max(1,Math.ceil(steps/maxTicks));
  for(var i=0;i<=steps;i+=tickEvery){
    var t=document.createElement('div');t.className='sp-sl-tick';
    t.style.left=(i/steps*100)+'%';ticks.appendChild(t);
  }
  track.appendChild(fill);track.appendChild(ticks);track.appendChild(thumb);tw.appendChild(track);
  wrap.appendChild(valbox);wrap.appendChild(tw);
  function pct(){return(cur-o.min)/(o.max-o.min)}
  function render(){
    if(document.activeElement!==inputEl) inputEl.value=cur;
    var p=Math.max(0,Math.min(1,pct()))*100;fill.style.width=p+'%';thumb.style.left=p+'%';
    var ts=ticks.querySelectorAll('.sp-sl-tick');var fi=pct()*steps/tickEvery;
    ts.forEach(function(t,i){t.classList.toggle('sp-sl-tick-filled',i<=fi);});
  }
  function snap(v){return Math.round((v-o.min)/o.step)*o.step+o.min}
  function clamp(v){return Math.min(o.max,Math.max(o.min,v))}
  // escribir el valor a mano en el casillero
  inputEl.addEventListener('input',function(){
    var raw=inputEl.value.replace(/[^0-9.]/g,''); if(raw!==inputEl.value) inputEl.value=raw;
    var v=parseFloat(raw); if(isNaN(v))return;
    cur=v; var p=Math.max(0,Math.min(1,pct()))*100;fill.style.width=p+'%';thumb.style.left=p+'%';
  });
  inputEl.addEventListener('blur',function(){ cur=clamp(snap(isNaN(parseFloat(inputEl.value))?o.value:parseFloat(inputEl.value))); render(); });
  inputEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); inputEl.blur(); } });
  function fromX(x){var r=track.getBoundingClientRect();return clamp(snap((x-r.left)/r.width*(o.max-o.min)+o.min));}
  function set(v){if(v===cur)return;cur=v;render();navigator.vibrate&&navigator.vibrate(8);}
  var drag=false;
  function onMove(x){if(drag){set(fromX(x));}}
  thumb.addEventListener('mousedown',function(e){drag=true;e.preventDefault();});
  document.addEventListener('mousemove',function(e){onMove(e.clientX);});
  document.addEventListener('mouseup',function(){drag=false;});
  thumb.addEventListener('touchstart',function(e){drag=true;e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',function(e){if(drag){onMove(e.touches[0].clientX);}},{passive:true});
  document.addEventListener('touchend',function(){drag=false;});
  tw.addEventListener('click',function(e){if(e.target===thumb)return;set(fromX(e.clientX));});
  wrap.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){set(clamp(snap(cur+o.step)));e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){set(clamp(snap(cur-o.step)));e.preventDefault();}
  });
  wrap.getValue=function(){return clamp(snap(cur));};
  render();return wrap;
}
function spProjection(opts){
  var fromKg=opts.fromKg,toKg=opts.toKg,weeks=opts.weeks||12,unit=opts.unit||'kg',
      name=(opts.name&&opts.name.trim())||'',label=opts.targetDateLabel||'Meta';
  var wrap=document.createElement('div');wrap.className='sp-pj-wrap';
  var h=document.createElement('p');h.className='sp-pj-headline';h.textContent=name?(name+', este es tu camino'):'Este es tu camino';wrap.appendChild(h);
  var NS='http://www.w3.org/2000/svg',W=320,H=160,PL=44,PR=24,PT=18,PB=32;
  var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('preserveAspectRatio','xMidYMid meet');svg.setAttribute('class','sp-pj-svg');
  var defs=document.createElementNS(NS,'defs');
  var lg=document.createElementNS(NS,'linearGradient');lg.setAttribute('id','sp-pj-lg');lg.setAttribute('x1','0%');lg.setAttribute('y1','0%');lg.setAttribute('x2','100%');lg.setAttribute('y2','0%');
  var s1=document.createElementNS(NS,'stop');s1.setAttribute('offset','0%');s1.setAttribute('stop-color','#DE7A38');
  var s2=document.createElementNS(NS,'stop');s2.setAttribute('offset','100%');s2.setAttribute('stop-color','#1B9E82');
  lg.appendChild(s1);lg.appendChild(s2);
  var ag=document.createElementNS(NS,'linearGradient');ag.setAttribute('id','sp-pj-ag');ag.setAttribute('x1','0%');ag.setAttribute('y1','0%');ag.setAttribute('x2','0%');ag.setAttribute('y2','100%');
  var a1=document.createElementNS(NS,'stop');a1.setAttribute('offset','0%');a1.setAttribute('stop-color','#DE7A38');a1.setAttribute('stop-opacity','0.28');
  var a2=document.createElementNS(NS,'stop');a2.setAttribute('offset','100%');a2.setAttribute('stop-color','#1B9E82');a2.setAttribute('stop-opacity','0');
  ag.appendChild(a1);ag.appendChild(a2);
  defs.appendChild(lg);defs.appendChild(ag);svg.appendChild(defs);
  var x0=PL,x1=W-PR,y0=PT,y1=H-PB,pts=[],N=60;
  for(var i=0;i<=N;i++){var tt=i/N,ease=1-Math.pow(1-tt,2.4);pts.push([x0+(x1-x0)*tt,y0+(y1-y0)*ease]);}
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var j=1;j<pts.length;j++){var px=pts[j-1],nx=pts[j],cpx=(px[0]+nx[0])/2;d+=' C'+cpx+','+px[1]+' '+cpx+','+nx[1]+' '+nx[0]+','+nx[1];}
  var last=pts[pts.length-1];
  var area=document.createElementNS(NS,'path');area.setAttribute('d',d+' L'+last[0]+','+y1+' L'+x0+','+y1+' Z');area.setAttribute('fill','url(#sp-pj-ag)');area.setAttribute('opacity','0');svg.appendChild(area);
  var line=document.createElementNS(NS,'path');line.setAttribute('d',d);line.setAttribute('fill','none');line.setAttribute('stroke','url(#sp-pj-lg)');line.setAttribute('stroke-width','3');line.setAttribute('stroke-linecap','round');svg.appendChild(line);
  var ax1=document.createElementNS(NS,'text');ax1.setAttribute('x',x0);ax1.setAttribute('y',H-6);ax1.setAttribute('text-anchor','middle');ax1.setAttribute('class','sp-pj-axis-label');ax1.textContent='Hoy';
  var ax2=document.createElementNS(NS,'text');ax2.setAttribute('x',x1);ax2.setAttribute('y',H-6);ax2.setAttribute('text-anchor','middle');ax2.setAttribute('class','sp-pj-axis-label');ax2.textContent=label;
  var wl1=document.createElementNS(NS,'text');wl1.setAttribute('x',x0-4);wl1.setAttribute('y',y0+4);wl1.setAttribute('text-anchor','end');wl1.setAttribute('class','sp-pj-weight-label');wl1.setAttribute('fill','#6E8188');wl1.textContent=fromKg+unit;
  var dlabel=document.createElementNS(NS,'text');dlabel.setAttribute('x',x1+4);dlabel.setAttribute('y',last[1]+4);dlabel.setAttribute('text-anchor','end');dlabel.setAttribute('class','sp-pj-weight-label');dlabel.setAttribute('fill','#1B9E82');dlabel.setAttribute('opacity','0');dlabel.textContent=toKg+unit;
  var dot=document.createElementNS(NS,'circle');dot.setAttribute('cx',last[0]);dot.setAttribute('cy',last[1]);dot.setAttribute('r','5');dot.setAttribute('fill','#1B9E82');dot.setAttribute('class','sp-pj-dot');dot.setAttribute('opacity','0');
  svg.appendChild(ax1);svg.appendChild(ax2);svg.appendChild(wl1);svg.appendChild(dlabel);svg.appendChild(dot);wrap.appendChild(svg);
  function initAnim(){
    var len=line.getTotalLength();line.setAttribute('stroke-dasharray',len);line.setAttribute('stroke-dashoffset',len);
    var start=null,dur=1600;
    function frame(ts){if(!start)start=ts;var p=Math.min((ts-start)/dur,1),ease=1-Math.pow(1-p,3);line.setAttribute('stroke-dashoffset',len*(1-ease));if(p<1){requestAnimationFrame(frame);}else{area.setAttribute('opacity','1');dot.setAttribute('opacity','1');dlabel.setAttribute('opacity','1');}}
    requestAnimationFrame(frame);
  }
  var ob=new IntersectionObserver(function(en){if(en[0].isIntersecting){ob.disconnect();initAnim();}},{threshold:.1});ob.observe(wrap);
  return wrap;
}
function spGauge(opts){
  var value=opts.value||0,label=opts.label||'',sublabel=opts.sublabel||'';
  var wrap=document.createElement('div');wrap.className='sp-gg-wrap';
  var lbl=document.createElement('div');lbl.className='sp-gg-label';lbl.textContent=label;
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 200 110');svg.setAttribute('class','sp-gg-svg');
  var defs=document.createElementNS(ns,'defs');var grad=document.createElementNS(ns,'linearGradient');grad.setAttribute('id','sp-gg-grad');grad.setAttribute('x1','0%');grad.setAttribute('y1','0%');grad.setAttribute('x2','100%');grad.setAttribute('y2','0%');
  var g1=document.createElementNS(ns,'stop');g1.setAttribute('offset','0%');g1.setAttribute('stop-color','#DE7A38');var g2=document.createElementNS(ns,'stop');g2.setAttribute('offset','100%');g2.setAttribute('stop-color','#1B9E82');
  grad.appendChild(g1);grad.appendChild(g2);defs.appendChild(grad);svg.appendChild(defs);
  var cx=100,cy=100,r=80,sw=14;
  function arc(angle){var a=(angle-180)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
  var track=document.createElementNS(ns,'path');var ts=arc(0),te=arc(180);
  track.setAttribute('d','M'+ts.x+','+ts.y+' A'+r+','+r+' 0 0,1 '+te.x+','+te.y);track.setAttribute('fill','none');track.setAttribute('stroke','#E4DFD5');track.setAttribute('stroke-width',sw);track.setAttribute('stroke-linecap','round');svg.appendChild(track);
  var arcEl=document.createElementNS(ns,'path');arcEl.setAttribute('fill','none');arcEl.setAttribute('stroke','url(#sp-gg-grad)');arcEl.setAttribute('stroke-width',sw);arcEl.setAttribute('stroke-linecap','round');svg.appendChild(arcEl);
  var needleLen=r-4;var needle=document.createElementNS(ns,'line');needle.setAttribute('x1',cx);needle.setAttribute('y1',cy);needle.setAttribute('stroke','#20323A');needle.setAttribute('stroke-width','2.5');needle.setAttribute('stroke-linecap','round');svg.appendChild(needle);
  var dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r','5');dot.setAttribute('fill','#20323A');svg.appendChild(dot);
  var valDiv=document.createElement('div');valDiv.className='sp-gg-value';valDiv.textContent='0';
  var sub=document.createElement('div');sub.className='sp-gg-sublabel';sub.textContent=sublabel;
  wrap.appendChild(lbl);wrap.appendChild(svg);wrap.appendChild(valDiv);wrap.appendChild(sub);
  function update(p){var angle=p*180,end=arc(angle),lf=angle>180?1:0,start=arc(0);
    if(p<0.002){arcEl.setAttribute('d','');}else{arcEl.setAttribute('d','M'+start.x+','+start.y+' A'+r+','+r+' 0 '+lf+',1 '+end.x+','+end.y);}
    var na=(angle-180)*Math.PI/180;needle.setAttribute('x2',cx+needleLen*Math.cos(na));needle.setAttribute('y2',cy+needleLen*Math.sin(na));valDiv.textContent=Math.round(p*value);}
  update(0);
  var obs=new IntersectionObserver(function(en){if(!en[0].isIntersecting)return;obs.disconnect();var dur=1300,start=null;
    function frame(now){if(!start)start=now;var t=Math.min((now-start)/dur,1),ease=1-Math.pow(1-t,3);update(ease);if(t<1)requestAnimationFrame(frame);else update(1);}requestAnimationFrame(frame);},{threshold:.2});
  obs.observe(wrap);
  return wrap;
}

function captureEmail(email){
  try{
    var payload={ email:email, answers:state.answers, source:'quiz-taichi', ts:new Date().toISOString(), url:location.href };
    if(CONFIG.EMAIL_WEBHOOK){
      fetch(CONFIG.EMAIL_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true,mode:'cors'}).catch(function(){});
    }
    if(window.dataLayer) window.dataLayer.push({event:'quiz_email_capture', email:email});
    if(typeof window.fbq==='function') window.fbq('track','Lead');
    document.dispatchEvent(new CustomEvent('quizEmailCapture',{detail:payload}));
  }catch(e){}
}
function setProgress(){ var pct=Math.min(100,Math.round(state.i/TOTAL*100));
  bar.style.width=pct+'%'; countEl.textContent=(state.i<TOTAL?'FASE '+(state.i+1)+'/'+TOTAL:'');

function go(n){ state.i=n; render(); window.scrollTo({top:0,behavior:'smooth'}); }
backBtn.onclick=function(){ if(state.i>0) go(state.i-1); };

function render(){

  if(s.type==='cards'){
    var hasImg=s.opts.some(function(o){return o.img;});
    if(s.grid && !hasImg){
      html+='<div class="sp-grid tiles">';
      s.opts.forEach(function(o,idx){ html+='<div class="sp-card tile" data-i="'+idx+'"><div class="sp-label">'+esc(o.t)+'</div></div>'; });

      });
    }
    html+='</div>'; stage.innerHTML=html;
    stage.querySelectorAll('.sp-card').forEach(function(c){ c.onclick=function(){

      navigator.vibrate&&navigator.vibrate(10);
      setTimeout(function(){ go(state.i+1); },280); }; });

    html+='<div class="sp-grid">';

    stage.innerHTML=html; var picked={};
    stage.querySelectorAll('.sp-card').forEach(function(c){ c.onclick=function(){
      c.classList.toggle('sel'); picked[c.dataset.i]=c.classList.contains('sel');
      var any=Object.keys(picked).some(function(k){return picked[k];});
      document.getElementById('spNext').disabled=!any;
      if(s.type==='empathy'&&any) document.getElementById('spBox').style.display='block'; }; });
    document.getElementById('spNext').onclick=function(){
      state.answers[s.key||state.i]=s.opts.filter(function(o,idx){return picked[idx];}).map(function(o){return o.t;});
      go(state.i+1); };
    return;
  }
  if(s.type==='inter'){
    html='';
    if(s.phase) html+='<span class="sp-phase">'+esc(s.phase)+'</span>';
    html+='<div class="sp-inter">'+(s.heroImg?'<div class="sp-hero-step"><img src="'+s.heroImg+'" alt="" loading="lazy" decoding="async"></div>':'<div class="sp-icon">'+(s.icon||'🛡️')+'</div>')+'<h1>'+(s.h||'')+'</h1><p>'+esc(s.body||'')+'</p>'+(s.quote?'<p class="sp-quote">'+esc(s.quote)+'</p>':'')+'</div>';
    html+='<button class="sp-cta" id="spNext">Continuar</button>';
    stage.innerHTML=html; document.getElementById('spNext').onclick=function(){ go(state.i+1); };
    return;

  if(s.type==='commit'){
    html+='<div class="sp-grid">';

    stage.querySelectorAll('.sp-card').forEach(function(c){ c.onclick=function(){ c.classList.add('sel'); setTimeout(function(){go(state.i+1);},260); }; });
    return;
  }
  if(s.type==='slider'){
    html+='<div id="spSliderHost"></div><button class="sp-cta" id="spNext">Continuar</button>';
    stage.innerHTML=html;
    var sl=spSlider({min:s.min,max:s.max,value:s.value,step:s.step||1,unit:s.unit||''});
    document.getElementById('spSliderHost').appendChild(sl);
    document.getElementById('spNext').onclick=function(){ state.answers[s.key||state.i]=sl.getValue(); go(state.i+1); };

    var itype=s.inputType||'text';

    html+='<button class="sp-cta" id="spNext" disabled>Continuar</button>';
    stage.innerHTML=html;
    var inp=document.getElementById('spInput'), nx=document.getElementById('spNext'); inp.focus();
    function _valid(v){ return itype==='email' ? /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) : !!v; }
    inp.oninput=function(){ nx.disabled=!_valid(inp.value.trim()); };
    inp.onkeydown=function(e){ if(e.key==='Enter'&&_valid(inp.value.trim())) nx.click(); };
    nx.onclick=function(){ var v=inp.value.trim(); if(s.key) state.answers[s.key]=v; if(itype==='email') captureEmail(v); go(state.i+1); };
    return;
  }
}

function renderResult(){
  bar.style.width='100%'; countEl.textContent=''; backBtn.classList.remove('show');
  var A=state.answers;
  // tipo de cuerpo -> rango de grasa corporal (hoy -> meta)
  var bmap={'Delgado':['10-14%','8-12%'],'Normal':['18-22%','14-18%'],'Con sobrepeso':['26-30%','20-24%']};
  var pair=bmap[A.grasa]||['18-22%','14-18%'];
  var grasaNow=pair[0], grasaGoal=pair[1];
  var nivel=A.nivel||'Un poco limitada';
  var zonas=Array.isArray(A.zonas)?A.zonas:[];
  var zHtml=zonas.length?('<div class="sp-attack"><b>Tu plan de Tai Chi también trabaja:</b>'+
    zonas.map(function(z){return '<div class="z"><span class="ck">✔</span><span>'+esc(z)+'</span></div>';}).join('')+'</div>'):'';
  // peso -> proyección + potencial
  var peso=parseFloat(A.peso)||82, meta=parseFloat(A.pesoMeta)||72;
  if(meta>=peso) meta=Math.max(45, peso-5);
  var diff=Math.max(1, peso-meta);
  var weeks=Math.min(24, Math.max(4, Math.round(diff/0.7)));
  var nivelScore={'Muy flexible':88,'Algo flexible':80,'Un poco limitada':72,'No lo sé':74}[nivel]||76;
  var potential=Math.min(96, nivelScore + zonas.length*2 + 6);
  stage.style.padding='24px 18px 42px';
  stage.innerHTML='<div class="sp-result"><span class="sp-phase">Tu resultado'+(A.name?' · '+esc(A.name):'')+'</span>'+
    '<h1 class="sp-h">Tu <span class="am">plan personalizado</span> está listo</h1>'+
    '<div id="spGaugeHost"></div>'+
    '<p class="sp-sub">Según tus respuestas, armamos un plan de Tai Chi en silla a tu medida. Esto es lo que podés lograr:</p>'+
    '<div class="sp-vsbox"><div class="nowb"><span class="lab">Grasa hoy</span><div class="v">'+esc(grasaNow)+'</div></div>'+
    '<div class="goalb"><span class="lab">Tu meta</span><div class="v">'+esc(grasaGoal)+'</div></div></div>'+
    '<div id="spProjHost" style="margin:22px 0 6px"></div>'+
    zHtml+
    '<button class="sp-cta" id="spBuild">Ver mi plan</button></div>';
  document.getElementById('spGaugeHost').appendChild(spGauge({value:potential, label:'Tu puntaje de bienestar', sublabel:'sobre 100 · tu potencial de mejora'}));
  document.getElementById('spProjHost').appendChild(spProjection({fromKg:peso, toKg:meta, weeks:weeks, unit:'kg', name:A.name, targetDateLabel:'En '+weeks+' sem'}));
  var zs=stage.querySelectorAll('.sp-attack .z');
  zs.forEach(function(z,idx){ setTimeout(function(){ z.classList.add('in'); }, 700+idx*130); });
  document.getElementById('spBuild').onclick=runLoader;
}

}

/* Colapsa el espacio superior que meten algunos temas de Shopify (padding de sección,
   centrado vertical o párrafos vacíos que agrega el editor). No afecta el archivo suelto. */
(function liftTop(){
  var el=document.getElementById("sp"); if(!el) return;
  function fix(){
    var cur=el;
    for(var h=0; h<9 && cur.parentElement && cur.parentElement!==document.documentElement; h++){
      var p=cur.parentElement, cs=getComputedStyle(p);
      if(cs.position!=="fixed" && cs.position!=="sticky"){
        var sib=cur.previousElementSibling;
        while(sib){
          var prev=sib.previousElementSibling;
          var txt=(sib.textContent||"").replace(/s| /g,"");
          if(!txt && !sib.querySelector("img,iframe,video,svg,canvas,input,button,select")) sib.remove();
          sib=prev;
        }
        p.style.setProperty("padding-top","0","important");
        p.style.setProperty("margin-top","0","important");
        if(cs.display.indexOf("flex")>-1 && cs.flexDirection.indexOf("column")>-1){
          p.style.setProperty("justify-content","flex-start","important");
        }
      }
      cur=p;
    }
  }
  fix(); setTimeout(fix,250); setTimeout(fix,900);
})();
})();
</script>
